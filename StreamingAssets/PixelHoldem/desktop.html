</script><script>'use strict';
window.MonsterTutorial = class MonsterTutorial {
 constructor(content,options){this.options=options;this.root=content.attachShadow({mode:'open'});this.timer=null;this.destroyed=false;this.feedback='';this.hint=false;this.state=options.state;this.render()}
 static fresh(installed=false){return {version:1,step:0,installed,flop:false,dealt:false,turn:false,river:false,outcome:false,selected:[],rank:0,installProgress:0}}
 static load(value){const s=MonsterTutorial.fresh();if(!value||value.version!==1)return s;for(const key of ['installed','flop','dealt','turn','river','outcome'])if(typeof value[key]==='boolean')s[key]=value[key];if(Number.isInteger(value.step)&&value.step>=0&&value.step<=12)s.step=value.step;if(Number.isInteger(value.rank)&&value.rank>=0&&value.rank<3)s.rank=value.rank;if(Array.isArray(value.selected)&&value.selected.length<=5&&new Set(value.selected).size===value.selected.length&&value.selected.every(i=>Number.isInteger(i)&&i>=0&&i<7))s.selected=value.selected;if(Number.isFinite(value.installProgress))s.installProgress=Math.max(0,Math.min(100,value.installProgress));if(s.step===12&&!s.installed){s.step=11;s.installProgress=0}return s}
 get board(){return ['K♠','T♠','2♦','9♥','A♠']}
 get hand(){return ['Q♠','J♠']}
 get step(){return this.state.step}
 get visible(){return this.step>=9?5:this.step===8?(this.state.river?5:4):this.step>=7?4:this.step===6?(this.state.turn?4:3):this.step>=2?3:this.step===1&&this.state.flop?3:0}
 get paid(){return this.step>=8?120:this.step>=6?60:this.step>=4?20:0}
 get dealt(){return this.step>=5||this.step===4&&this.state.dealt}
 save(){this.options.save(this.state)}
 advance(){if(this.step>=12)return;this.state.step++;this.feedback='';this.hint=false;this.save();this.render()}
 reveal(key){this.state[key]=true;this.save();this.render()}
 card(c,{hidden=false,empty=false,small=false,picked=false,index=null}={}){const cls='training-card'+(hidden?' back':'')+(empty?' empty':'')+(small?' small':'')+(picked?' picked':'')+(!hidden&&!empty&&'♥♦'.includes(c?.[1])?' red':'');const inside=hidden?'<span>◆</span>':empty?'':`<b>${c[0]==='T'?'10':c[0]}</b><span>${c[1]}</span>`;if(index!==null)return `<button class="${cls}${this.hint&&[0,1,2,3,6].includes(index)?' suggested':''}" data-pick="${index}" aria-label="${c[0]==='T'?'10':c[0]}${c[1]} 선택" aria-pressed="${picked}">${inside}</button>`;return `<div class="${cls}" ${empty?'aria-hidden="true"':`aria-label="${hidden?'뒷면':c}"`}>${inside}</div>`}
 monster(){return `<div class="monster" aria-label="테이블에 사는 괴물의 그림자 모형" role="img"><div class="monster-aura"></div><svg viewBox="0 0 120 150" shape-rendering="crispEdges" aria-hidden="true"><path class="shadow-shape" d="M18 4 37 20 49 15 66 15 82 6 86 28 99 42 98 64 90 78 103 92 113 100 116 119 104 113 108 130 95 122 90 109 85 139 76 136 72 148 60 140 47 148 44 137 32 142 29 113 20 128 10 132 15 115 4 122 8 102 23 88 31 78 23 62 22 40 30 29Z"/><path class="shadow-chest" d="M37 78 56 92 76 80 77 114 63 130 45 117Z"/><g class="monster-eyes"><path d="M34 46h15v5H34zm35 0h15v5H69z"/><path class="pupil" d="M40 45h4v8h-4zm35 0h4v8h-4z"/></g></svg><div class="monster-floor-shadow"></div><span>이 테이블의 주인</span></div>`}
 get speech(){return [
 ['처음 보는 얼굴이네요.','저는 이 컴퓨터 속, 이 테이블에 먼저 살고 있던 그림자입니다. 게임은 아직 설치되어 있지 않군요. 제가 한 판 가르쳐드리겠습니다. 상대보다 강한 <em>다섯 장의 조합</em>을 만들면 이깁니다. 준비되셨나요?'],
 ['우선, 테이블을 보세요.','바닥에 놓인 패는 <em>공용 카드</em>입니다. 당신도, 저도 함께 쓸 수 있죠. 처음에는 세 장을 보여드리겠습니다. 남은 두 장은 배팅이 이어지는 동안 한 장씩 열립니다.'],
 ['강한 패의 모양부터 기억해 두세요.','같은 무늬로 이어진 다섯 장은 <em>스트레이트 플러시</em>, 같은 숫자 네 장은 <em>포카드</em>, 세 장과 한 쌍은 <em>풀하우스</em>입니다. 아래 이름을 눌러 모양을 살펴보세요. 결국 쓸 수 있는 건 다섯 장뿐입니다.'],
 ['첫 배팅입니다.','먼저 <em>20칩</em>을 테이블에 놓아보세요. 제가 같은 금액을 따라 내겠습니다. 이렇게 양쪽이 걸어둔 칩을 모아 <em>팟</em>이라고 부릅니다. 이긴 쪽이 가져갑니다.'],
 ['이제 당신의 패를 드리죠.','바닥의 카드만으로는 누구도 알 수 없습니다. 이번에는 <em>당신만 사용하는 두 장</em>입니다. 받아서 확인해 보세요. 나중에 이 손패와 바닥의 공용 카드에서 다섯 장을 고르게 됩니다.'],
 ['두 번째 배팅을 해보세요.','손패가 보이니 생각이 달라지셨나요? 이번에는 <em>40칩을 더</em> 놓아보세요. 저도 따라 내겠습니다. 지금은 흐름을 배우는 수업이니, 제가 정해둔 금액으로 진행하겠습니다.'],
 ['네 번째 카드를 공개하겠습니다.','배팅이 맞춰졌습니다. 바닥의 카드를 <em>한 장 더</em> 열어보세요. 새로운 카드 한 장이 지금의 조합을 바꿀 수도 있습니다. 내 손패와 함께 보세요.'],
 ['세 번째 배팅입니다.','마지막 카드를 보기 전에 <em>60칩을 더</em> 걸어보세요. 이번 수업의 마지막 배팅입니다. 실제 대결에서는 상황에 따라 체크, 콜, 레이즈 또는 폴드를 고르게 됩니다.'],
 ['마지막 한 장입니다.','바닥에 <em>다섯 번째 카드</em>가 기다립니다. 직접 공개해 보세요. 무슨 패가 완성될지, 이제 끝까지 보겠습니다.'],
 ['당신의 다섯 장을 고르세요.','손패 두 장과 바닥의 다섯 장, 모두 일곱 장입니다. 그중 <em>가장 강한 다섯 장</em>을 직접 골라보세요. 같은 무늬로 <em>10, J, Q, K, A</em>가 이어지는지 살펴보세요. 선택한 카드는 다시 눌러 뺄 수 있습니다.'],
 ['이제, 서로의 패를 볼 시간입니다.','당신은 <em>가장 높은 스트레이트 플러시</em>를 완성했습니다. 제 패도 공개해 보세요. 둘의 조합을 비교하면 누가 팟을 가져갈지 알 수 있습니다.'],
 ['배울 준비는 끝났습니다.','잘하셨습니다. 이제 이 컴퓨터에 <em>게임을 설치</em>해 드리겠습니다. 상점과 스킬도 함께 생길 겁니다. 조금만 기다리세요. 당신의 자리는 비워 두겠습니다.'],
 ['다음에는 연습이 아닙니다.','바탕화면에 <em>PIXEL HOLD’EM, 상점, 스킬</em>이 생겼습니다. 게임 아이콘을 눌러 당신의 판을 시작하세요. 다시 배우고 싶다면 언제든 이 방으로 돌아오셔도 됩니다.']
 ][this.step]}
 get title(){return ['방문자','바닥의 패','상위 패 조합','첫 번째 배팅','당신의 손패','두 번째 배팅','네 번째 카드','세 번째 배팅','마지막 카드','다섯 장 조합','승부 공개','게임 설치','설치 완료'][this.step]}
 get primary(){const p=this.step,s=this.state;return p===0?'이야기를 듣겠습니다 →':p===1?(s.flop?'강한 조합을 알려주세요 →':'바닥의 세 장 공개'):p===2?'첫 배팅을 해보겠습니다 →':p===3?'20칩 배팅':p===4?(s.dealt?'두 번째 배팅으로 →':'카드 받기'):p===5?'40칩 추가 배팅':p===6?(s.turn?'세 번째 배팅으로 →':'네 번째 카드 공개'):p===7?'60칩 추가 배팅':p===8?(s.river?'다섯 장 고르기 →':'다섯 번째 카드 공개'):p===9?'이 다섯 장으로 승부':p===10?(s.outcome?'승부를 확인했습니다 →':'괴물의 패 공개'):p===11?'설치 중…':'바탕화면으로 돌아가기'}
 action(){const p=this.step,s=this.state;if(p===1&&!s.flop){this.reveal('flop');return}if(p===4&&!s.dealt){this.reveal('dealt');return}if(p===6&&!s.turn){this.reveal('turn');return}if(p===8&&!s.river){this.reveal('river');return}if(p===9){if(s.selected.length!==5)return;const all=[...this.hand,...this.board];if(cmp(five(s.selected.map(i=>all[i])),evalHand(all))!==0){this.feedback='조합을 한 번 더 보세요. 같은 ♠ 무늬의 10 · J · Q · K · A를 찾아보세요.';this.hint=true;this.render();return}}if(p===10&&!s.outcome){s.outcome=true;this.save();this.render();return}if(p===12){this.options.close();return}if(p!==11)this.advance()}
 pick(i){const a=this.state.selected;if(a.includes(i))this.state.selected=a.filter(v=>v!==i);else if(a.length<5)a.push(i);else this.feedback='다섯 장이 선택되어 있습니다. 바꾸려면 선택한 카드 한 장을 먼저 빼세요.';this.save();this.render()}

theme').value=settings.theme;c.querySelector('#theme').onchange=e=>{settings.theme=e.target.value;applySettings();persist()};for(const key of ['sound','motion'])c.querySelector('#'+key).onclick=()=>{settings[key]=!settings[key];applySettings();persist();renderAll();scheduleAI()};c.querySelector('#pause').onclick=()=>{settings.paused=!settings.paused;persist();renderAll();scheduleAI()};c.querySelector('#export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(game.s,null,2)],{type:'application/json'}));a.href=url;a.download='pixel-holdem-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};c.querySelector('#import').onclick=()=>c.querySelector('#save-file').click();c.querySelector('#save-file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const data=normalizeSave(JSON.parse(await file.text()));dialog('기록 불러오기','현재 진행 상황을 선택한 백업으로 바꾸시겠습니까?',()=>{game=new HoldemGame(data);selected=[];persist();renderAll();scheduleAI();notify('기록을 불러왔습니다.')})}catch(e){notify('기록을 불러올 수 없습니다: '+e.message)}};c.querySelector('#reset-record').onclick=()=>dialog('기록 초기화','칩, 전적, 아이템, 스킬을 초기화하시겠습니까? 이 브라우저에 저장된 기록이 바뀝니다.',()=>{game=new HoldemGame(null,Math.random,false);selected=[];if(wins.has('game')){wins.get('game').el.hidden=true;wins.get('game').task.classList.remove('active')}persist();renderAll();scheduleAI();notify('기록을 초기화했습니다. 게임 앱을 열어 시작하세요.')})}

function dialog(title,text,onConfirm,extra=null){document.querySelector('.dialog-backdrop')?.remove();const back=document.createElement('div');back.className='dialog-backdrop';back.innerHTML=`<section class="dialog-box" role="dialog" aria-modal="true" aria-label="${title}"><div class="window-title"><span>${title}</span></div><div class="dialog-copy"></div><div class="dialog-actions"><button data-cancel>취소</button><button data-confirm>확인</button></div></section>`;back.querySelector('.dialog-copy').textContent=text;if(extra)back.querySelector('.dialog-copy').append(extra);const previousPause=settings.paused;settings.paused=true;clearTimeout(aiTimer);const close=()=>{back.remove();settings.paused=previousPause;renderAll();scheduleAI()};back.querySelector('[data-cancel]').onclick=close;back.querySelector('[data-confirm]').onclick=()=>{close();onConfirm()};document.body.append(back);back.querySelector('[data-confirm]').focus();return back}

function normalizeSave(data){if(!data||typeof data!=='object')throw Error('올바른 JSON 기록이 아닙니다.');if(data.Schema!==undefined){const native=data,conv=c=>c<0?'?':R[c%13]+'♣♦♥♠'[Math.floor(c/13)];data={schema:1,phase:['betting','showdown','roundOver','shopping'][native.Phase],match:native.Match,round:native.Round,dealer:native.Dealer,turn:native.Turn,street:native.Street,current:native.CurrentBet,chips:native.Chips,paid:native.Paid,streetPaid:native.StreetPaid,acted:native.Acted,freeBoost:native.FreeBoost,aiName:native.AiName,player:native.Player.map(conv),ai:native.Ai.map(conv),board:native.Board.map(conv),deck:native.Deck.map(conv),discard:native.Discard.map(conv),peeked:native.Peeked,inventory:native.Inventory,levels:native.Levels,bullets:native.Bullets,loaded:native.Loaded,revolverUses:native.RevolverUses,pending:native.Pending?{player:native.Pending.Player,slot:native.Pending.Slot,before:conv(native.Pending.Before)}:null,focusRemaining:native.FocusRemaining,focusUsed:native.FocusUsed,matchWins:native.MatchWins,roundResults:native.RoundResults,played:native.Played,wins:native.Wins,streak:native.Streak,bestStreak:native.BestStreak,lastBonus:native.LastBonus,lastPayout:native.LastPayout,lastWin:null,notice:native.Notice,result:native.Result,jokerChange:native.JokerChange,aiRevealed:native.AiRevealed}}delete data.skillPoints;const int=n=>Number.isSafeInteger(n)&&n>=0,arr=(a,n)=>Array.isArray(a)&&a.length===n&&a.every(int);if(data.schema!==1||!['ready','betting','showdown','roundOver','shopping','bankrupt'].includes(data.phase)||!arr(data.chips,2)||!arr(data.inventory,4)||!arr(data.levels,4)||!arr(data.paid,2)||!arr(data.streetPaid,2)||!arr(data.matchWins,2)||!Array.isArray(data.acted)||data.acted.length!==2||!data.acted.every(v=>typeof v==='boolean')||![data.match,data.round,data.street,data.turn,data.dealer,data.current,data.bullets,data.loaded,data.revolverUses,data.focusRemaining,data.freeBoost,data.streak,data.played,data.wins,data.bestStreak].every(int)||data.round<1||data.round>5||data.street>3||data.turn>1||data.dealer>1)throw Error('게임 데이터 형식이 맞지 않습니다.');for(const key of ['player','ai','board','deck','discard'])if(!Array.isArray(data[key])||!data[key].every(c=>c==='?'||typeof c==='string'&&c.length===2&&R.includes(c[0])&&S.includes(c[1])))throw Error('카드 데이터가 올바르지 않습니다.');if(!Array.isArray(data.peeked)||!data.peeked.every(i=>int(i)&&i<data.ai.length)||!Array.isArray(data.roundResults)||!data.roundResults.every(i=>[-1,0,1].includes(i))||((data.phase==='ready'||data.phase==='bankrupt'&&data.player.length===0)?(data.player.length!==0||data.ai.length!==0||data.board.length!==0||data.deck.length!==0):(data.player.length<2||data.ai.length<2||data.ai.length>4))||data.board.length>5||data.deck.length>52)throw Error('진행 정보가 올바르지 않습니다.');const cards=[...data.player,...data.ai,...data.board,...data.deck,...data.discard].filter(c=>c!=='?');if(new Set(cards).size!==cards.length)throw Error('중복된 카드가 있습니다.');if(data.phase==='bankrupt'&&(data.chips[0]!==0||data.paid.some(n=>n!==0)))throw Error('파산 기록이 올바르지 않습니다.');if(data.phase==='showdown'&&data.board.length!==5)throw Error('쇼다운 카드가 부족합니다.');if(data.pending&&(![true,false].includes(data.pending.player)||!int(data.pending.slot)||data.pending.slot>=(data.pending.player?data.player.length:data.ai.length)))throw Error('리볼버 상태가 올바르지 않습니다.');for(const k of ['aiName','notice','result','jokerChange'])if(typeof data[k]!=='string'||data[k].length>2000)throw Error('기록의 텍스트 형식이 맞지 않습니다.');if(data.itemUsed!==undefined&&(!Array.isArray(data.itemUsed)||data.itemUsed.length!==4||!data.itemUsed.every(v=>typeof v==='boolean')))throw Error('아이템 사용 정보가 올바르지 않습니다.');if(data.jokerUses!==undefined&&(!int(data.jokerUses)||data.jokerUses>1))throw Error('조커 사용 정보가 올바르지 않습니다.');if(data.player.filter(c=>c==='?').length>2||data.ai.filter(c=>c==='?').length>2)throw Error('조커는 최대 두 장입니다.');for(const k of ['jokerActiveUsed','passiveJoker'])if(data[k]!==undefined&&typeof data[k]!=='boolean')throw Error('조커 정보가 올바르지 않습니다 function drawWallpaper(){const c=$('#wallpaper');c.width=480;c.height=Math.round(480*(innerHeight-38)/innerWidth);const x=c.getContext('2d'),w=c.width,h=c.height;let seed=98;const rand=()=>{seed=seed*16807%2147483647;return seed/2147483647};const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#337b9d');g.addColorStop(.57,'#a9d1cd');g.addColorStop(.58,'#79a66b');g.addColorStop(1,'#294b35');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<25;i++){const cx=rand()*w,cy=rand()*h*.43,s=5+rand()*13;for(let j=0;j<7;j++){x.fillStyle=j<3?'#bedbd6':'#edf0dc';x.fillRect(Math.floor(cx+rand()*s*3),Math.floor(cy+rand()*s*.65),Math.ceil(s*(.6+rand())),Math.ceil(s*.33))}}const hill=(base,amp,color,phase)=>{x.fillStyle=color;x.beginPath();x.moveTo(0,h);for(let i=0;i<=w;i+=2)x.lineTo(i,Math.floor(base+Math.sin(i/125+phase)*amp+Math.sin(i/57+phase)*amp*.15));x.lineTo(w,h);x.fill()};hill(h*.62,h*.08,'#739d62',1);hill(h*.73,h*.12,'#4e8047',3);hill(h*.9,h*.1,'#355b38',.2);for(let i=0;i<11000;i++){const px=rand()*w,py=h*.57+rand()*h*.43;x.fillStyle=['#a6b57544','#192f2e33','#7a9a5b44','#afbb7d22'][i%4];x.fillRect(px,py,1+rand()*3,1)}}
